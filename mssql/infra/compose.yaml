version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password1!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql 
      - ./backup:/backup
    restart: no

volumes:
  mssql_data:
